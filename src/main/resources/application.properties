# application
quarkus.application.name=sora
quarkus.http.port=${SORA_HTTP_PORT:8080}
sora.server.public-url=${SORA_PUBLIC_URL:http://localhost:8080}

# http
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.trusted-proxies=${SORA_TRUSTED_PROXIES:127.0.0.1,::1}

# database
quarkus.datasource.db-kind=mariadb
quarkus.datasource.jdbc.url=jdbc:mariadb://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:sora}
quarkus.datasource.username=${DATABASE_USERNAME:sora}
quarkus.datasource.password=${DATABASE_PASSWORD:sora}
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.hibernate-orm.log.sql=false
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# redis
quarkus.redis.hosts=redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}

# lazer
sora.lazer.client-id=${SORA_LAZER_CLIENT_ID:5}
sora.lazer.client-secret=${SORA_LAZER_CLIENT_SECRET:FGc9GAtyHzeQDshWP5Ah7dega8hJACAJpQtw6OXk}

# bancho
sora.bancho.welcome-message=Welcome to sora!

# test
# forwarding adds ~3.7s to each test HTTP request
%test.quarkus.http.proxy.proxy-address-forwarding=false
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:sora;MODE=MariaDB;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.flyway.enabled=false
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
